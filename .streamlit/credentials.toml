# An empty email here is what stops Streamlit's first-run "👋 Welcome" prompt.
#
# Without this file Streamlit asks for an email on stdin before it will serve
# anything. On a laptop you press Enter and move on; on Streamlit Cloud there is
# no one to press Enter, so the process sits waiting and the health check fails
# with "connection refused" — after a dependency install that looked completely
# successful.
#
# gatherUsageStats in config.toml does NOT cover this; it is a separate file.
[general]
email = ""
