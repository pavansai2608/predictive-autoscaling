# An empty email in credentials.toml is what stops the first-run prompt; this
# file is only appearance. gatherUsageStats is a separate switch from that.
[browser]
gatherUsageStats = false

# ---------------------------------------------------------------------------
# Printed-report theme.
#
# These values MUST track the tokens at the top of dashboard.py. Streamlit's own
# widgets — slider, segmented control, dataframe, expander — are painted from
# here, not from the injected CSS, so a mismatch shows up as controls sitting on
# a slightly wrong stock.
#
# THREE accents, and they are not decoration. Each is one arm of the benchmark:
# rust = the stock HPA, navy = the forecast owning the replica count, forest =
# the forecast raising the HPA's floor. The same three appear in the README and
# in analyze.py's figures, so the comparison reads by colour before a single
# number is parsed. All three clear 6:1 on both the paper and the card fill, and
# the charts also key each arm by DASH so the series survive greyscale printing
# and red-green colour blindness.
#
# dashboard.py passes explicit Altair scales rather than relying on the order
# below, so an arm keeps its colour on a two-arm scenario as well as a three-arm
# one. The order here is the fallback, not the mechanism.
# ---------------------------------------------------------------------------
[theme]
base = "light"

backgroundColor          = "#e8edee"   # cool drafting stock, not a warm cream
secondaryBackgroundColor = "#dde4e5"   # sidebar, table headers, raised surfaces
textColor                = "#101619"
primaryColor             = "#8c2f39"   # rust: interactive chrome and the lead accent
borderColor              = "#c8d1d3"
linkColor                = "#15616d"

# Newsreader carries everything you READ, IBM Plex Mono everything you MEASURE,
# IBM Plex Sans the interface furniture in between. Set as a trio on purpose:
# the previous Inter-on-near-black pairing was the default dark-dashboard look
# and read as generated rather than designed.
font        = "IBM Plex Sans, ui-sans-serif, system-ui, sans-serif"
headingFont = "Newsreader, Georgia, Times New Roman, serif"
codeFont    = "IBM Plex Mono, ui-monospace, SFMono-Regular, monospace"

baseFontSize   = 15
# Small radii, not pill shapes. Report figures sit in ruled boxes.
baseRadius     = "0.25rem"
buttonRadius   = "0.25rem"
showWidgetBorder = true

metricValueFontSize   = "1.5rem"
metricValueFontWeight = 600

# Arm colours first, in prefix order A/B/C.
chartCategoricalColors = ["#8c2f39", "#15616d", "#4a6b2a", "#5d666a", "#8a6d1f"]
chartSequentialColors  = ["#dde4e5", "#dfe4ea", "#c2ccd8", "#9aacc0", "#6d87a5", "#42648a", "#15616d"]

redColor   = "#8c2f39"
blueColor  = "#15616d"
greenColor = "#4a6b2a"
grayColor  = "#5d666a"

[theme.sidebar]
backgroundColor = "#dde4e5"
borderColor     = "#c8d1d3"
